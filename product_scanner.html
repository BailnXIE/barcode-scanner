<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店條碼掃描器 Demo</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- ZXing：支援 TRY_HARDER / HybridBinarizer，專門強化難掃的一維條碼 -->
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }

        #reader-clip {
            width: 100%;
            max-width: 420px;
            height: 160px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            position: relative;
        }

        #scan-hint {
            margin: 10px auto 0;
            max-width: 420px;
            font-size: 0.9em;
            color: #666;
        }

        #controls {
            margin: 12px auto 0;
            max-width: 420px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        #reader {
            width: 100%;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        #reader video {
            width: 100% !important;
            border: none !important;
        }

        #reader #qr-shaded-region {
            display: none !important;
        }

        #reader-clip::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 2;
        }

        #result-box {
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.2em;
        }

        .price {
            color: #e53935;
            font-size: 1.5em;
            font-weight: bold;
        }

        .retry-btn,
        .ctrl-btn {
            padding: 10px 16px;
            font-size: 1em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .ctrl-btn {
            background-color: #455a64;
        }

        .ctrl-btn.active {
            background-color: #f9a825;
            color: #222;
        }

        .ctrl-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>簡易收銀掃描器</h2>

    <div id="reader-clip">
        <div id="reader"></div>
    </div>
    <p id="scan-hint">保持 15–25 公分，等畫面清晰後對準。紙盒低對比可開手電筒；系統會做對比強化與多幀確認。</p>
    <div id="controls">
        <button id="torch-btn" class="ctrl-btn" type="button" disabled>手電筒</button>
    </div>

    <div id="result-box">請允許相機權限並掃描條碼...</div>

    <script>
        let productDatabase = {};
        let html5QrCode;
        let isHandlingScan = false;
        let torchOn = false;
        let enhanceTimer = null;
        let recentHits = [];
        let zxingReader = null;
        let enhanceCanvas = null;
        let enhanceCtx = null;

        const scannerConfig = {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39
            ],
            useBarCodeDetectorIfSupported: true
        };

        const hdConstraints = {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 },
            focusMode: "continuous",
            advanced: [{ focusMode: "continuous" }]
        };

        const basicConstraints = {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
        };

        fetch('products_data.csv')
            .then(response => response.text())
            .then(csvText => {
                const lines = csvText.split('\n');
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    // 條碼,品牌,系列,商品名稱,價錢
                    const [barcode, brand, series, name, price] = lines[i].split(',');
                    productDatabase[barcode.trim()] = {
                        brand: brand.trim(),
                        series: series.trim(),
                        name: name.trim(),
                        price: price.trim()
                    };
                }
                console.log("CSV 資料載入完成！", productDatabase);
                initZxing();
                startScanner();
            })
            .catch(err => {
                document.getElementById('result-box').innerHTML = "<b>錯誤：無法讀取 CSV 檔案。</b>";
                console.error(err);
            });

        // UPC-A(12) 常被解成 EAN-13(前面補 0)，雙向相容查詢
        function findProduct(rawCode) {
            const code = String(rawCode).trim();
            const candidates = [code];

            if (/^\d{12}$/.test(code)) {
                candidates.push("0" + code);
            }
            if (/^\d{13}$/.test(code) && code.startsWith("0")) {
                candidates.push(code.slice(1));
            }

            for (const key of candidates) {
                if (productDatabase[key]) {
                    return { product: productDatabase[key], matchedCode: key, scannedCode: code };
                }
            }
            return null;
        }

        function initZxing() {
            if (typeof ZXing === "undefined") {
                console.warn("ZXing 未載入，將只使用 html5-qrcode");
                return;
            }

            const hints = new Map();
            // 主流優化：花更多時間、多角度嘗試（類似「盡力糾錯/搜尋」）
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,
                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E,
                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39
            ]);

            zxingReader = new ZXing.MultiFormatReader();
            zxingReader.setHints(hints);
            enhanceCanvas = document.createElement("canvas");
            enhanceCtx = enhanceCanvas.getContext("2d", { willReadFrequently: true });
        }

        function buildScanConfig(videoConstraints) {
            return {
                fps: 30,
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    const width = Math.floor(Math.min(viewfinderWidth * 0.9, 400));
                    const height = Math.floor(Math.min(viewfinderHeight * 0.4, 180));
                    return { width, height };
                },
                disableFlip: false,
                videoConstraints
            };
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader", scannerConfig);

            html5QrCode.start(
                { facingMode: "environment" },
                buildScanConfig(hdConstraints),
                onScanSuccess,
                onScanFailure
            ).then(() => {
                onCameraReady();
            }).catch(() => {
                return html5QrCode.start(
                    { facingMode: "environment" },
                    buildScanConfig(basicConstraints),
                    onScanSuccess,
                    onScanFailure
                ).then(() => {
                    onCameraReady();
                });
            }).catch(err => {
                document.getElementById('result-box').innerHTML =
                    "<b>無法開啟相機：</b>" + err;
                console.error(err);
            });
        }

        function onCameraReady() {
            ensureNaturalFocus();
            setupTorchButton();
            startEnhancedDecodeLoop();
        }

        function ensureNaturalFocus() {
            try {
                const caps = html5QrCode.getRunningTrackCameraCapabilities();
                if (caps.zoomFeature().isSupported()) {
                    caps.zoomFeature().apply(caps.zoomFeature().min());
                }
                if (caps.focusModeFeature().isSupported()) {
                    caps.focusModeFeature().apply("continuous");
                }
            } catch (err) {
                console.log("無法調整對焦設定", err);
            }
        }

        function setupTorchButton() {
            const btn = document.getElementById("torch-btn");
            try {
                const caps = html5QrCode.getRunningTrackCameraCapabilities();
                if (!caps.torchFeature().isSupported()) {
                    btn.textContent = "手電筒（不支援）";
                    btn.disabled = true;
                    return;
                }
                btn.disabled = false;
                btn.onclick = () => {
                    torchOn = !torchOn;
                    caps.torchFeature().apply(torchOn);
                    btn.classList.toggle("active", torchOn);
                    btn.textContent = torchOn ? "關閉手電筒" : "手電筒";
                };
            } catch (err) {
                btn.textContent = "手電筒（不支援）";
                btn.disabled = true;
            }
        }

        // 對比拉伸：紙盒低對比常見優化
        function stretchContrast(imageData) {
            const d = imageData.data;
            let min = 255;
            let max = 0;

            for (let i = 0; i < d.length; i += 4) {
                const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                if (g < min) min = g;
                if (g > max) max = g;
            }

            const range = Math.max(18, max - min);
            for (let i = 0; i < d.length; i += 4) {
                const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                let v = ((g - min) / range) * 255;
                // 再稍微加重對比，幫助灰底印刷
                v = (v - 128) * 1.35 + 128;
                v = Math.max(0, Math.min(255, v));
                d[i] = d[i + 1] = d[i + 2] = v;
            }
            return imageData;
        }

        function tryZxingDecode(canvas) {
            if (!zxingReader) return null;

            try {
                const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
                // HybridBinarizer：局部閾值，適合光線不均的紙質包裝
                const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
                const result = zxingReader.decode(bitmap);
                zxingReader.reset();
                return result.getText();
            } catch (e1) {
                try {
                    // 反相再試：深色底淺色條、或曝光異常時有用
                    const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
                    const inverted = new ZXing.InvertedLuminanceSource(source);
                    const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(inverted));
                    const result = zxingReader.decode(bitmap);
                    zxingReader.reset();
                    return result.getText();
                } catch (e2) {
                    try { zxingReader.reset(); } catch (_) {}
                    return null;
                }
            }
        }

        // 多幀確認：連續兩次以上相同結果才算成功，降低誤讀
        function confirmByMultiFrame(text) {
            recentHits.push(text);
            if (recentHits.length > 6) recentHits.shift();
            return recentHits.filter((t) => t === text).length >= 2;
        }

        function startEnhancedDecodeLoop() {
            if (!zxingReader || enhanceTimer) return;

            enhanceTimer = setInterval(() => {
                if (isHandlingScan) return;

                const video = document.querySelector("#reader video");
                if (!video || video.readyState < 2) return;

                const vw = video.videoWidth;
                const vh = video.videoHeight;
                if (!vw || !vh) return;

                // 只取畫面中央掃描帶，對應綠框區域
                const cropH = Math.floor(vh * 0.42);
                const cropY = Math.floor((vh - cropH) / 2);
                const cropW = Math.floor(vw * 0.92);
                const cropX = Math.floor((vw - cropW) / 2);

                enhanceCanvas.width = cropW;
                enhanceCanvas.height = cropH;
                enhanceCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                const raw = enhanceCtx.getImageData(0, 0, cropW, cropH);
                enhanceCtx.putImageData(stretchContrast(raw), 0, 0);

                const decoded = tryZxingDecode(enhanceCanvas);
                if (decoded && confirmByMultiFrame(decoded)) {
                    onScanSuccess(decoded);
                }
            }, 220);
        }

        function stopEnhancedDecodeLoop() {
            if (enhanceTimer) {
                clearInterval(enhanceTimer);
                enhanceTimer = null;
            }
            recentHits = [];
        }

        function onScanSuccess(decodedText) {
            if (isHandlingScan) return;
            isHandlingScan = true;
            stopEnhancedDecodeLoop();

            const resultBox = document.getElementById('result-box');
            const torchBtn = document.getElementById("torch-btn");
            torchBtn.disabled = true;

            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                console.log("相機已停止");

                const found = findProduct(decodedText);
                const retryButton = `<br><button class="retry-btn" onclick="location.reload()">掃描下一個商品</button>`;

                if (found) {
                    const { product, scannedCode } = found;
                    resultBox.innerHTML = `
                        <div style="font-size: 0.9em; color: gray;">掃描成功：${scannedCode}</div>
                        <div style="margin-top: 10px;">品牌：<strong>${product.brand}</strong></div>
                        <div style="margin-top: 6px;">系列：${product.series}</div>
                        <div style="margin-top: 6px;">商品名稱：<strong>${product.name}</strong></div>
                        <div style="margin-top: 10px;">售價：<span class="price">$${product.price}</span></div>
                        ${retryButton}
                    `;
                } else {
                    resultBox.innerHTML = `
                        <span style="color:#f57c00;">系統內找不到條碼 ${decodedText}</span>
                        ${retryButton}
                    `;
                }
            }).catch(err => {
                isHandlingScan = false;
                console.error("無法停止相機", err);
            });
        }

        function onScanFailure() {
            // html5-qrcode 未辨識時略過；強化迴圈會另外嘗試
        }
    </script>
</body>
</html>
