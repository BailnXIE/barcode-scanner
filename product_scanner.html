<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店條碼掃描器 Demo</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /* 容器大小 = 掃描框，多餘相機畫面被裁掉 */
        #reader {
            width: 140px;
            height: 7px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            position: relative;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border: none !important;
        }

        /* 隱藏套件的上下遮罩區域 */
        #reader #qr-shaded-region {
            display: none !important;
        }

        /* 掃描框邊框提示 */
        #reader::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            pointer-events: none;
            box-sizing: border-box;
        }

        #result-box {
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.2em;
        }

        .price {
            color: #e53935;
            font-size: 1.5em;
            font-weight: bold;
        }

        .retry-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1.1em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>簡易收銀掃描器</h2>

    <div id="reader"></div>

    <div id="result-box">請允許相機權限並掃描條碼...</div>

    <script>
        const QRBOX = { width: 280, height: 140 };

        let productDatabase = {};
        let html5QrCode;
        let isHandlingScan = false;

        fetch('products_data.csv')
            .then(response => response.text())
            .then(csvText => {
                const lines = csvText.split('\n');
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    const [barcode, name, price] = lines[i].split(',');
                    productDatabase[barcode.trim()] = {
                        name: name.trim(),
                        price: price.trim()
                    };
                }
                console.log("CSV 資料載入完成！", productDatabase);
                startScanner();
            })
            .catch(err => {
                document.getElementById('result-box').innerHTML = "<b>錯誤：無法讀取 CSV 檔案。</b>";
                console.error(err);
            });

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 15,
                    qrbox: QRBOX,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39
                    ]
                },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                document.getElementById('result-box').innerHTML =
                    "<b>無法開啟相機：</b>" + err;
                console.error(err);
            });
        }

        function onScanSuccess(decodedText) {
            if (isHandlingScan) return;
            isHandlingScan = true;

            const resultBox = document.getElementById('result-box');

            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                console.log("相機已停止");

                const product = productDatabase[decodedText];
                const retryButton = `<br><button class="retry-btn" onclick="location.reload()">掃描下一個商品</button>`;

                if (product) {
                    resultBox.innerHTML = `
                        <div style="font-size: 0.9em; color: gray;">掃描成功：${decodedText}</div>
                        <div style="margin-top: 10px;">商品名稱：<strong>${product.name}</strong></div>
                        <div style="margin-top: 10px;">售價：<span class="price">$${product.price}</span></div>
                        ${retryButton}
                    `;
                } else {
                    resultBox.innerHTML = `
                        <span style="color:#f57c00;">系統內找不到條碼 ${decodedText}</span>
                        ${retryButton}
                    `;
                }
            }).catch(err => {
                isHandlingScan = false;
                console.error("無法停止相機", err);
            });
        }

        function onScanFailure() {
            // 掃描中未辨識到條碼時略過
        }
    </script>
</body>
</html>
