<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店條碼掃描器 Demo</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #111111; color: white; margin: 0; }
        
        #reader { width: 100%; max-width: 400px; margin: 0 auto; background: black; border: none; }
        
        /* 讓框外變成純黑色，完美隱藏相機畫面 */
        #qr-shaded-region {
            background-color: #111111 !important; 
            border-color: #111111 !important; 
        }

        #result-box { margin-top: 20px; padding: 20px; background: #ffffff; color: #333333; border-radius: 8px; font-size: 1.2em; }
        .price { color: #e53935; font-size: 1.5em; font-weight: bold; }
        
        /* 重新掃描按鈕的樣式 */
        .btn-restart { margin-top: 15px; padding: 12px 24px; font-size: 1.1em; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <h2>簡易收銀掃描器</h2>
    
    <div id="reader"></div>
    <div id="result-box">系統載入中，請稍候...</div>

    <script>
        let productDatabase = {};
        let html5QrCode; 
        let isScanning = false; // 建立一個安全鎖，防止連續重複掃描

        // 1. 讀取 CSV 檔案
        fetch('products_data.csv')
            .then(response => response.text())
            .then(csvText => {
                const lines = csvText.split('\n'); 
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue; 
                    const [barcode, name, price] = lines[i].split(',');
                    productDatabase[barcode.trim()] = { 
                        name: name.trim(), 
                        price: price.trim() 
                    };
                }
                document.getElementById('result-box').innerHTML = "請對準條碼進行掃描...";
                startScanner();
            })
            .catch(err => {
                document.getElementById('result-box').innerHTML = "<b style='color:red;'>錯誤：無法讀取 CSV 檔案。</b>";
            });

        // 2. 使用底層 API 強制啟動高畫質相機
        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");

            // 強制高畫質設定
            const cameraConfig = { 
                facingMode: "environment",
                width: { min: 1280, ideal: 1920 },
                height: { min: 720, ideal: 1080 }
            };

            // 掃描框與支援格式設定
            const scanConfig = {
                fps: 15,
                qrbox: { width: 250, height: 120 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39
                ]
            };

            html5QrCode.start(cameraConfig, scanConfig, onScanSuccess, onScanFailure)
                .then(() => {
                    isScanning = true; // 相機成功啟動，打開安全鎖
                })
                .catch(err => {
                    document.getElementById('result-box').innerHTML = "<b style='color:red;'>無法啟動相機，請確認權限。</b>";
                });
        }

        // 3. 掃描成功後的動作
        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return; // 如果已經掃描到了，就不再重複執行
            isScanning = false;      // 立刻鎖上安全鎖

            // 停止相機
            html5QrCode.stop().then(() => {
                
                // 相機停止後，顯示結果與重新整理按鈕
                const resultBox = document.getElementById('result-box');
                const product = productDatabase[decodedText];
                const retryButton = `<button class="btn-restart" onclick="location.reload()">掃描下一個商品</button>`;

                if (product) {
                    resultBox.innerHTML = `
                        <div style="font-size: 0.9em; color: gray;">掃描成功：${decodedText}</div>
                        <div style="margin-top: 10px;">商品名稱：<strong>${product.name}</strong></div>
                        <div style="margin-top: 10px;">售價：<span class="price">$${product.price}</span></div>
                        ${retryButton}
                    `;
                } else {
                    resultBox.innerHTML = `
                        <div style="color:#f57c00; font-weight:bold; font-size:1.2em;">系統內找不到條碼</div>
                        <div style="color:gray; font-size:0.9em; margin-top:5px;">${decodedText}</div>
                        ${retryButton}
                    `;
                }
            }).catch(err => {
                console.error("無法停止相機", err);
            });
        }

        function onScanFailure(error) {
            // 掃描過程中略過錯誤
        }
    </script>
</body>
</html>
