<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店條碼掃描器 Demo</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /*
          外層只顯示中間掃描帶（視覺裁切）。
          內層 #reader 維持較大寬度，讓相機解析度 / qrbox 計算跟 index.html 一樣好掃。
        */
        #reader-clip {
            width: 100%;
            max-width: 420px;
            height: 160px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            position: relative;
        }

        #scan-hint {
            margin: 10px auto 0;
            max-width: 420px;
            font-size: 0.9em;
            color: #666;
        }

        #reader {
            width: 100%;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        #reader video {
            width: 100% !important;
            border: none !important;
        }

        /* 隱藏套件遮罩；畫面上下非掃描區由 #reader-clip 裁掉 */
        #reader #qr-shaded-region {
            display: none !important;
        }

        #reader-clip::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 2;
        }

        #result-box {
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.2em;
        }

        .price {
            color: #e53935;
            font-size: 1.5em;
            font-weight: bold;
        }

        .retry-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1.1em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>簡易收銀掃描器</h2>

    <div id="reader-clip">
        <div id="reader"></div>
    </div>
    <p id="scan-hint">小條碼請靠近至填滿綠框，並盡量在光線充足處掃描</p>

    <div id="result-box">請允許相機權限並掃描條碼...</div>

    <script>
        let productDatabase = {};
        let html5QrCode;
        let isHandlingScan = false;

        // 格式限制放在建構子；並啟用瀏覽器原生條碼偵測（有支援時通常更靈敏）
        const scannerConfig = {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39
            ],
            useBarCodeDetectorIfSupported: true
        };

        // 高解析 + 連續對焦，提升小條碼 / 低對比包裝辨識率
        const hdConstraints = {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 },
            focusMode: "continuous",
            advanced: [{ focusMode: "continuous" }]
        };

        const basicConstraints = {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
        };

        fetch('products_data.csv')
            .then(response => response.text())
            .then(csvText => {
                const lines = csvText.split('\n');
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    const [barcode, name, price] = lines[i].split(',');
                    productDatabase[barcode.trim()] = {
                        name: name.trim(),
                        price: price.trim()
                    };
                }
                console.log("CSV 資料載入完成！", productDatabase);
                startScanner();
            })
            .catch(err => {
                document.getElementById('result-box').innerHTML = "<b>錯誤：無法讀取 CSV 檔案。</b>";
                console.error(err);
            });

        function buildScanConfig(videoConstraints) {
            return {
                fps: 30, // 提高嘗試次數，低對比較容易掃到
                // 依實際畫面動態決定掃描框：條碼靠近時佔比較大、較好辨識
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    const width = Math.floor(Math.min(viewfinderWidth * 0.85, 360));
                    const height = Math.floor(Math.min(viewfinderHeight * 0.35, 150));
                    return { width, height };
                },
                disableFlip: false,
                videoConstraints
            };
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader", scannerConfig);

            // 先試 HD + 連續對焦；失敗再退回較寬鬆設定
            html5QrCode.start(
                { facingMode: "environment" },
                buildScanConfig(hdConstraints),
                onScanSuccess,
                onScanFailure
            ).then(() => {
                enhanceCameraForSmallBarcodes();
            }).catch(() => {
                return html5QrCode.start(
                    { facingMode: "environment" },
                    buildScanConfig(basicConstraints),
                    onScanSuccess,
                    onScanFailure
                ).then(() => {
                    enhanceCameraForSmallBarcodes();
                });
            }).catch(err => {
                document.getElementById('result-box').innerHTML =
                    "<b>無法開啟相機：</b>" + err;
                console.error(err);
            });
        }

        // 裝置支援時：強制連續對焦，並略為變焦，讓小條碼佔更多像素
        function enhanceCameraForSmallBarcodes() {
            try {
                const caps = html5QrCode.getRunningTrackCameraCapabilities();

                if (caps.focusModeFeature().isSupported()) {
                    caps.focusModeFeature().apply("continuous");
                }

                if (caps.zoomFeature().isSupported()) {
                    const zoom = caps.zoomFeature();
                    const min = zoom.min();
                    const max = zoom.max();
                    // 約 1.6x～2x，兼顧小條碼與對準難度
                    const target = Math.min(max, Math.max(min, 1.8));
                    zoom.apply(target);
                }
            } catch (err) {
                console.log("此裝置不支援額外對焦/變焦強化", err);
            }
        }

        function onScanSuccess(decodedText) {
            if (isHandlingScan) return;
            isHandlingScan = true;

            const resultBox = document.getElementById('result-box');

            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                console.log("相機已停止");

                const product = productDatabase[decodedText];
                const retryButton = `<br><button class="retry-btn" onclick="location.reload()">掃描下一個商品</button>`;

                if (product) {
                    resultBox.innerHTML = `
                        <div style="font-size: 0.9em; color: gray;">掃描成功：${decodedText}</div>
                        <div style="margin-top: 10px;">商品名稱：<strong>${product.name}</strong></div>
                        <div style="margin-top: 10px;">售價：<span class="price">$${product.price}</span></div>
                        ${retryButton}
                    `;
                } else {
                    resultBox.innerHTML = `
                        <span style="color:#f57c00;">系統內找不到條碼 ${decodedText}</span>
                        ${retryButton}
                    `;
                }
            }).catch(err => {
                isHandlingScan = false;
                console.error("無法停止相機", err);
            });
        }

        function onScanFailure() {
            // 掃描中未辨識到條碼時略過
        }
    </script>
</body>
</html>
